[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iks-verify"
version = "0.1.0"
description = "Grounded QA and hallucination verification for Indian Knowledge Systems"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "python-dotenv>=1.0", "httpx>=0.27", "rapidfuzz>=3.9"
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "rank-bm25>=0.2.2", "matplotlib>=3.9"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["iks_verify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP042"]
